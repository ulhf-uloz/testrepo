<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電卓 - 私のポートフォリオ</title>
  <!-- CSSのパス（相対パス） -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ヘッダー（他のページと共通のクラス名・構造） -->
  <header class="header">
    <h1>私のポートフォリオ</h1>
    <nav>
      <ul>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>
        <li><a href="work.html">課題</a></li>
        <li><a href="calc.html">電卓</a></li>
        <li><a href="github_search.html">GitHub検索</a></li> <!-- ★追加 -->
      </ul>
    </nav>
  </header>

  <!-- メインコンテンツ -->
  <main class="container">
    <h2>電卓</h2>
    
    <div class="calc-form" style="margin: 20px 0;">
      <!-- 値1 -->
      <input type="number" id="num1" placeholder="値1">
      
      <!-- 演算子 -->
      <select id="operator">
        <option value="+">＋</option>
        <option value="-">－</option>
        <option value="*">×</option>
        <option value="/">÷</option>
      </select>
      
      <!-- 値2 -->
      <input type="number" id="num2" placeholder="値2">
    </div>

    <!-- 計算結果表示エリア -->
    <div id="result" class="result-area" style="font-size: 1.2em; font-weight: bold; margin-top: 15px;">
      両方の数値を入力してください
    </div>
  </main>

  <!-- フッター -->
  <footer>
    <p>&copy; 2026 私のポートフォリオ</p>
  </footer>

  <!-- JSの読み込み -->
  <script src="calc.js"></script>
</body>
</html>
