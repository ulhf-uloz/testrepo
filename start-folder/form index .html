<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>お問い合わせ</h1>
    <nav>
      <ul>
        <li><a href="#">ホーム（リンクは何でも良い）</a></li>
        <li><a href="#">会社概要（リンクは何でも良い）</a></li>
        <li><a href="#">お問い合わせ（リンクは何でも良い）</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>お問い合わせフォーム</h2>
      <p>ご質問・ご意見がございましたら、以下のフォームにご記入の上、送信してください。</p>

      <form action="#" method="POST">
        <h3>お客様情報</h3>
        
        <p>
          <label for="name">お名前</label><br>
          <input type="text" id="name" name="name" placeholder="例：山田太郎">
        </p>

        <p>
          <label for="email">メールアドレス</label><br>
          <input type="email" id="email" name="email" placeholder="例：example@example.com">
        </p>

        <p>
          <label for="tel">電話番号</label><br>
          <input type="tel" id="tel" name="tel" placeholder="例：090-1234-5678">
        </p>

        <h3>お問い合わせ内容</h3>

        <p>
          <label for="category">お問い合わせの種類</label><br>
          <select id="category" name="category">
            <option value="">選択してください</option>
            <option value="service">について</option>
            <option value="other">その他</option>
          </select>
        </p>

        <p>
          <label for="message">内容</label><br>
          <textarea id="message" name="message" rows="5" placeholder="こちらにご記入ください"></textarea>
        </p>

        <h3>個人情報の取り扱い</h3>
        <p>
          <label>
            <input type="checkbox" name="privacy" value="agree">
            個人情報の取り扱いに同意する
          </label>
        </p>

        <p>
          <button type="submit">送信</button>
        </p>
      </form>
    </section>
  </main>
</body>
</html>
